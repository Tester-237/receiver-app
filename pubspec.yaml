name: penerima_pesanan
description: Aplikasi penerima pesanan multi-toko UMKM dengan cetak struk otomatis.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.0
  shared_preferences: ^2.3.2
  print_bluetooth_thermal: ^1.1.9
  esc_pos_utils_plus: ^2.0.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
